name: Build Rinoceronte iPhone Inspector

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install protobuf xcodegen

      - name: Build and test
        run: bash tools/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RinoceronteInspector-unsigned
          path: |
            build/RinoceronteInspector-unsigned.ipa
            build/SHA256SUMS.txt
            build/toolchain.txt
          retention-days: 3
          if-no-files-found: error
